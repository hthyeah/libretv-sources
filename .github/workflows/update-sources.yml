name: update-sources

# 每天自动重建 LibreTV 源列表。
# 产物去向（双通道）：
#   ① 提交回本私有仓库（代码与数据备份、可追溯）
#   ② 同步推送到 Gitee 的【公开产物仓库】—— 供 LibreTV 订阅
#      （私有仓库 raw 读不到，所以订阅源必须是公开可读的；Gitee 国内还更快）
on:
  schedule:
    - cron: "0 18 * * *"     # 每天 UTC 18:00（北京 02:00）自动跑
  workflow_dispatch:          # 也可以手动点按钮立即跑

permissions:
  contents: write             # 需要写权限才能把 sources.json 提交回本仓库

env:
  # ── 只需改下面两行 ────────────────────────────────────────
  GITEE_USER: "hthyeah"                  # 改成你的 Gitee 用户名
  GITEE_REPO: "libretv-sources"          # 改成你的 Gitee 公开仓库名
  # ─────────────────────────────────────────────────────────
  # 然后在 Settings → Secrets and variables → Actions 里添加
  # 唯一的秘密：GITEE_TOKEN = Gitee 私人令牌（勾 projects 权限）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 实测并生成源列表
        run: python build_sources.py

      - name: 提交回私有仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json
          if git diff --cached --quiet; then
            echo "源列表无变化，跳过提交"
          else
            git commit -m "chore: 自动更新源列表 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # ── 第二通道：同步到 Gitee 公开产物仓库 ────────────────────────
      # 未配置 GITEE_TOKEN 时本步骤自动跳过，不影响主流程
      - name: 同步到 Gitee（后备订阅源）
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "⚠️ 未配置 GITEE_TOKEN，跳过 Gitee 同步（主流程不受影响）"
            exit 0
          fi
          git clone --depth 1 \
            "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${GITEE_REPO}.git" mirror
          cp sources.json mirror/
          cd mirror
          git config user.name  "github-actions[bot]"
          git config user.email "actions@users.noreply.gitee.com"
          git add sources.json
          if git diff --cached --quiet; then
            echo "Gitee 侧无变化"
          else
            git commit -m "sync: 来自 GitHub Actions $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ 已同步到 Gitee"
          fi

      - name: 写入任务摘要
        run: |
          {
            echo "## 源列表更新完成"
            echo ""
            echo "触发方式：${{ github.event_name }}"
            echo ""
            python3 - <<'PY'
          import json
          d = json.load(open("sources.json"))
          s = d["sources"]
          n_adult = sum(1 for x in s if x["isAdult"])
          print(f"- 列表名：{d['name']}")
          print(f"- 可用源总数：**{len(s)}**（isAdult 标记 {n_adult} 个）")
          print("")
          print("| 源名 | 地址 |")
          print("|:--|:--|")
          for x in s[:50]:
              tag = " `18+`" if x["isAdult"] else ""
              print(f"| {x['name']}{tag} | `{x['url']}` |")
          PY
          } >> $GITHUB_STEP_SUMMARY
