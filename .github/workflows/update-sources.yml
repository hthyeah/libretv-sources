name: update-sources

# 每天自动重建 LibreTV 订阅内容：点播源 + 直播源。
# 产物去向（双通道）：
#   ① 提交回本私有仓库（代码与数据备份、可追溯）
#   ② 同步推送到 Gitee 的【公开产物仓库】—— 供 LibreTV 订阅
#      （私有仓库 raw 读不到，所以订阅源必须公开可读；Gitee 国内还更快）
on:
  schedule:
    - cron: "0 18 * * *"     # 每天 UTC 18:00（北京 02:00）自动跑
  workflow_dispatch:          # 也可以手动点按钮立即跑
  push:
    branches: [main]
    paths-ignore:             # 产物变化不触发，避免「提交产物→再触发」死循环
      - "sources.json"
      - "live.m3u"
      - "README.md"
      - "DEPLOY.md"

permissions:
  contents: write             # 需要写权限才能把产物提交回本仓库

env:
  # ── 只需改下面两行 ────────────────────────────────────────
  GITEE_USER: "hthyeah"                  # 改成你的 Gitee 用户名
  GITEE_REPO: "libretv-sources"          # 改成你的 Gitee 公开仓库名
  # ─────────────────────────────────────────────────────────
  # 直播源镜像地址：构建时写进订阅的 liveSources
  # ⚠️ Gitee 在主人网络下 TLS 被阻断（实测 Connection reset），改用 ghproxy 代理 GitHub raw
  LIVE_MIRROR_URL: "https://ghproxy.net/https://raw.githubusercontent.com/hthyeah/libretv-sources/main/live.slim.m3u"
  # 节目单（EPG）：51zmt，实测 100 频道 / 3800+ 条节目
  LIVE_EPG: "http://epg.51zmt.top:8000/e.xml"
  # 然后在 Settings → Secrets and variables → Actions 里添加
  # 唯一的秘密：GITEE_TOKEN = Gitee 私人令牌（勾 projects 权限）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 实测点播源 + 构建直播源
        run: python build_sources.py

      - name: 提交回私有仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json live.m3u
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
          else
            git commit -m "chore: 自动更新源列表 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # ── 第二通道：同步到 Gitee 公开产物仓库 ────────────────────────
      # 未配置 GITEE_TOKEN 时本步骤自动跳过，不影响主流程
      - name: 同步到 Gitee（订阅源出口）
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "⚠️ 未配置 GITEE_TOKEN，跳过 Gitee 同步（主流程不受影响）"
            exit 0
          fi
          git clone --depth 1 \
            "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${GITEE_REPO}.git" mirror
          cp sources.json live.m3u mirror/
          cd mirror
          git config user.name  "github-actions[bot]"
          git config user.email "actions@users.noreply.gitee.com"
          git add sources.json live.m3u
          if git diff --cached --quiet; then
            echo "Gitee 侧无变化"
          else
            git commit -m "sync: 来自 GitHub Actions $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ 已同步到 Gitee"
          fi

      - name: 写入任务摘要
        run: |
          {
            echo "## 订阅内容更新完成"
            echo ""
            echo "触发方式：${{ github.event_name }}"
            echo ""
            python3 - <<'PY'
          import json, os
          d = json.load(open("sources.json"))
          s = d["sources"]
          lv = d.get("liveSources") or []
          n_adult = sum(1 for x in s if x["isAdult"])
          print(f"- 列表名：{d['name']}")
          print(f"- 点播源：**{len(s)}** 个（isAdult 标记 {n_adult} 个）")
          print(f"- 直播源：**{len(lv)}** 个")
          if os.path.exists("live.m3u"):
              n_ch = sum(1 for line in open("live.m3u", encoding="utf-8")
                         if line.startswith("#EXTINF"))
              print(f"- 直播频道：**{n_ch}** 个（合并去重后）")
          print()
          print("| 源名 | 地址 |")
          print("|:--|:--|")
          for x in s[:50]:
              tag = " `18+`" if x["isAdult"] else ""
              print(f"| {x['name']}{tag} | `{x['url']}` |")
          if lv:
              print()
              print("### 直播源")
              print("| 名称 | 地址 | EPG |")
              print("|:--|:--|:--|")
              for x in lv:
                  print(f"| {x['name']} | `{x['url']}` | {x.get('epg','-')} |")
          PY
          } >> $GITHUB_STEP_SUMMARY
